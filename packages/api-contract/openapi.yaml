openapi: 3.0.3
info:
  title: MM API
  version: 0.1.0
  description: |
    LINE/LIFF 前提の家計管理 API（初期スコープ）。
    本仕様は Expense CRUD と月次一覧取得を対象とする。
servers:
  - url: https://api.example.com
    description: Production (placeholder)
  - url: http://localhost:8787
    description: Local development
tags:
  - name: Expenses
    description: Expense resource operations
security:
  - bearerAuth: []
paths:
  /api/expenses:
    get:
      tags:
        - Expenses
      summary: 月次の支払い一覧を取得
      operationId: listExpensesByMonth
      parameters:
        - name: date
          in: query
          required: true
          description: 対象年月（YYYY-MM）
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: '2026-02'
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListExpensesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Expenses
      summary: 支払いを作成
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/expenses/{id}:
    put:
      tags:
        - Expenses
      summary: 支払いを更新
      operationId: updateExpense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpenseRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Expenses
      summary: 支払いを削除
      operationId: deleteExpense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ExpenseId:
      name: id
      in: path
      required: true
      description: Expense ID
      schema:
        type: string
  responses:
    BadRequest:
      description: リクエスト不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Invalid request
            details:
              field: date
              reason: must be YYYY-MM
    Unauthorized:
      description: 認証エラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Unauthorized
            details: {}
    NotFound:
      description: 対象なし
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Expense not found
            details:
              id: "exp_123"
    InternalServerError:
      description: サーバーエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Internal server error
            details: {}
  schemas:
    Expense:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - date
        - price
        - category
      properties:
        id:
          type: string
          example: exp_123
        userId:
          type: string
          example: user_1
        date:
          type: string
          format: date
          example: '2026-02-15'
        price:
          type: integer
          minimum: 0
          example: 1200
        category:
          type: string
          example: food
        memo:
          type: string
          nullable: true
          example: lunch
    CreateExpenseRequest:
      type: object
      additionalProperties: false
      required:
        - userId
        - date
        - price
        - category
      properties:
        userId:
          type: string
          example: user_1
        date:
          type: string
          format: date
          example: '2026-02-15'
        price:
          type: integer
          minimum: 0
          example: 1200
        category:
          type: string
          example: food
        memo:
          type: string
          nullable: true
          example: lunch
    UpdateExpenseRequest:
      type: object
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          example: '2026-02-15'
        price:
          type: integer
          minimum: 0
          example: 1200
        category:
          type: string
          example: food
        memo:
          type: string
          nullable: true
          example: lunch
      minProperties: 1
    ListExpensesResponse:
      type: object
      additionalProperties: false
      required:
        - expenses
      properties:
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
        - details
      properties:
        message:
          type: string
          example: Invalid request
        details:
          type: object
          additionalProperties: true
